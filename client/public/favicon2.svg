<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="390" viewBox="0 0 1000 390" role="img" aria-labelledby="title desc">
  <title id="title">Daily Mart</title>
  <desc id="desc">Daily Mart grocery store logo with a bright green shopping cart filled with fresh groceries and bold green and orange lettering.</desc>
  <defs>
    <linearGradient id="basket" x1="0" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#8BE51B"/>
      <stop offset=".48" stop-color="#24B83D"/>
      <stop offset="1" stop-color="#08733C"/>
    </linearGradient>
    <linearGradient id="greenText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#24B51D"/>
      <stop offset="1" stop-color="#006333"/>
    </linearGradient>
    <linearGradient id="orangeText" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFC400"/>
      <stop offset="1" stop-color="#FF7100"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#A4EF16"/>
      <stop offset="1" stop-color="#1AAE38"/>
    </linearGradient>
  </defs>

  <!-- Shopping cart and groceries -->
  <g transform="translate(8 7)">
    <!-- produce behind the basket -->
    <path d="M155 111C111 61 132 17 174 24c34 21 29 61-19 87Z" fill="#FFB51B"/>
    <path d="M145 57q24 9 34 39" fill="none" stroke="#FFE58A" stroke-width="7" stroke-linecap="round"/>
    <path d="M205 102C176 45 213 15 246 37c17 27-1 56-41 65Z" fill="#46C83A"/>
    <path d="M224 90q12-31 22-53" fill="none" stroke="#A8EE70" stroke-width="5" stroke-linecap="round"/>
    <path d="M295 105c-2-62 42-82 75-48 7 34-22 59-75 48Z" fill="#73D52A"/>
    <path d="M310 91q31-28 49-34" fill="none" stroke="#B9F77C" stroke-width="5" stroke-linecap="round"/>
    <path d="M371 119c8-44 44-56 68-29-1 31-31 47-68 29Z" fill="#FF8C12"/>
    <path d="M393 104q16-19 32-18" fill="none" stroke="#36A83D" stroke-width="7" stroke-linecap="round"/>
    <path d="M240 117c-7-44 25-67 54-47 13 28-8 50-54 47Z" fill="#27B84A"/>
    <path d="M255 105q17-22 33-34" fill="none" stroke="#9BE96A" stroke-width="5" stroke-linecap="round"/>
    <path d="M276 123c-1-25 23-40 43-25 5 21-13 34-43 25Z" fill="#F9C21B"/>
    <circle cx="230" cy="142" r="38" fill="#F04432"/>
    <path d="M230 105q-18-20-29-5 3 17 29 20 18-21 31-8-8 17-31 20" fill="#159B42"/>
    <path d="M305 144c-20-34 2-62 31-52 24 20 11 48-31 52Z" fill="#FFB900"/>
    <path d="M315 121q12-20 24-25" fill="none" stroke="#FFE16B" stroke-width="5" stroke-linecap="round"/>

    <!-- cart handle and basket -->
    <path d="M18 150H76L112 311Q117 333 140 333H443" fill="none" stroke="#075C35" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M79 153H478L431 294Q424 316 400 316H133Z" fill="url(#basket)" stroke="#075C35" stroke-width="10" stroke-linejoin="round"/>
    <path d="M148 190L166 279M244 190L252 279M340 190L329 279" fill="none" stroke="#F5FFF0" stroke-width="18" stroke-linecap="round"/>
    <path d="M103 164H464" stroke="#C6F47A" stroke-width="8" stroke-linecap="round"/>
    <!-- leaf accent -->
    <path d="M399 300C405 229 454 183 507 169c-7 65-42 112-108 131Z" fill="url(#leaf)" stroke="#F5FFF0" stroke-width="7"/>
    <path d="M414 283q34-61 76-98" fill="none" stroke="#E6FFC6" stroke-width="6" stroke-linecap="round"/>
    <!-- wheels -->
    <circle cx="174" cy="354" r="30" fill="#075B35"/>
    <circle cx="174" cy="354" r="12" fill="#F4FFF0"/>
    <circle cx="403" cy="354" r="30" fill="#075B35"/>
    <circle cx="403" cy="354" r="12" fill="#F4FFF0"/>
    <!-- motion accents -->
    <path d="M5 238h58M23 277h53" stroke="#73D51C" stroke-width="12" stroke-linecap="round"/>
    <path d="M42 309h48" stroke="#FFAA08" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Brand name only -->
  <g font-family="Arial, Helvetica, sans-serif" font-weight="900" font-style="italic" letter-spacing="-7">
    <text x="520" y="164" font-size="132" fill="url(#greenText)">Daily</text>
    <text x="515" y="306" font-size="137" fill="url(#orangeText)">Mart</text>
  </g>
</svg>